name: post-deploy smoke test

# Runs after every push to main. Waits for Railway to deploy the pushed
# commit, then verifies:
#   API tier (smoke job):
#     1. GET /api/health returns 200 and reports the pushed commit SHA.
#     2. GET /api/pdf-runtime-check returns 200 with ok:true (proves vendored
#        pypdf loads inside the actual Python subprocess used for PDF fills).
#   Frontend tier (frontend-smoke job, needs: smoke):
#     3. Landing page loads, hp-patches.js signals ready, all critical
#        window.__ globals defined, no console errors.
#     4. All critical form template PDFs are reachable with correct MIME.
#     5. A static PDF template serves valid %PDF bytes (cold-start check).
#     6. /api/pdf-runtime-check succeeds twice back-to-back (cold+warm Python).

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  # Public custom domain, live on Let's Encrypt via Railway as of Aug 13 2026.
  # api-production-2334.up.railway.app is still valid as a fallback if the
  # custom domain ever regresses — keep the previous value handy:
  #   PROD_HOST: api-production-2334.up.railway.app
  PROD_HOST: app.hearthandpage.ca
  # Max minutes to wait for Railway to finish deploying + rotate traffic.
  DEPLOY_WAIT_MINUTES: "6"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Print target commit
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "PROD_HOST=$PROD_HOST"

      - name: Wait for /api/health to report the pushed commit
        id: wait-health
        shell: bash
        run: |
          set -euo pipefail
          expected_short="${GITHUB_SHA:0:7}"
          echo "Waiting for commitShort=$expected_short on https://$PROD_HOST/api/health"
          deadline=$(( $(date +%s) + DEPLOY_WAIT_MINUTES*60 ))
          last=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body="$(curl -sS -m 10 "https://$PROD_HOST/api/health" || true)"
            got="$(printf '%s' "$body" | jq -r '.commitShort // empty' 2>/dev/null || true)"
            if [ -n "$got" ] && [ "$got" = "$expected_short" ]; then
              echo "OK: production reports commitShort=$got"
              echo "$body" | jq .
              exit 0
            fi
            if [ "$body" != "$last" ]; then
              echo "  seen: commitShort=$got   raw=$body"
              last="$body"
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for production to report commitShort=$expected_short"
          echo "Last body: $last"
          exit 1

      - name: Verify /api/pdf-runtime-check reports ok:true
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -sS -m 30 -o /tmp/pdfcheck.json -w '%{http_code}' "https://$PROD_HOST/api/pdf-runtime-check")"
          echo "HTTP $body"
          cat /tmp/pdfcheck.json | jq .
          test "$body" = "200"
          test "$(jq -r '.ok' /tmp/pdfcheck.json)" = "true"
          # Log the runtime pypdf version for the record.
          echo "pypdf on prod: $(jq -r '.pypdfVersion' /tmp/pdfcheck.json)"

  # Frontend smoke — runs after the API smoke passes. Guards against the three
  # named symptoms: PDF download button missing after login, incomplete form
  # list, and cold-start PDF silent failures. See tests/smoke/frontend-smoke.spec.js
  # for full docstring.
  frontend-smoke:
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Playwright + Chromium
        run: |
          npm install --no-save @playwright/test@^1.62.0
          npx playwright install --with-deps chromium

      - name: Run frontend smoke tests
        env:
          PROD_HOST: ${{ env.PROD_HOST }}
        run: npx playwright test

      - name: Upload traces on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-trace
          path: test-results/
          retention-days: 7

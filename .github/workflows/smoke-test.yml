name: post-deploy smoke test

# Runs after every push to main. Waits for Railway to deploy the pushed
# commit, then verifies:
#   1. GET /api/health returns 200 and reports the pushed commit SHA.
#   2. GET /api/pdf-runtime-check returns 200 with ok:true (proves vendored
#      pypdf loads inside the actual Python subprocess used for PDF fills).
#
# TODO after item 5 (SSL): flip PROD_HOST to app.hearthandpage.ca.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  # Public Railway URL. Once app.hearthandpage.ca SSL is fixed, replace this
  # with the custom domain — no other change should be needed.
  PROD_HOST: api-production-2334.up.railway.app
  # Max minutes to wait for Railway to finish deploying + rotate traffic.
  DEPLOY_WAIT_MINUTES: "6"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Print target commit
        run: |
          echo "GITHUB_SHA=$GITHUB_SHA"
          echo "PROD_HOST=$PROD_HOST"

      - name: Wait for /api/health to report the pushed commit
        id: wait-health
        shell: bash
        run: |
          set -euo pipefail
          expected_short="${GITHUB_SHA:0:7}"
          echo "Waiting for commitShort=$expected_short on https://$PROD_HOST/api/health"
          deadline=$(( $(date +%s) + DEPLOY_WAIT_MINUTES*60 ))
          last=""
          while [ "$(date +%s)" -lt "$deadline" ]; do
            body="$(curl -sS -m 10 "https://$PROD_HOST/api/health" || true)"
            got="$(printf '%s' "$body" | jq -r '.commitShort // empty' 2>/dev/null || true)"
            if [ -n "$got" ] && [ "$got" = "$expected_short" ]; then
              echo "OK: production reports commitShort=$got"
              echo "$body" | jq .
              exit 0
            fi
            if [ "$body" != "$last" ]; then
              echo "  seen: commitShort=$got   raw=$body"
              last="$body"
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for production to report commitShort=$expected_short"
          echo "Last body: $last"
          exit 1

      - name: Verify /api/pdf-runtime-check reports ok:true
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -sS -m 30 -o /tmp/pdfcheck.json -w '%{http_code}' "https://$PROD_HOST/api/pdf-runtime-check")"
          echo "HTTP $body"
          cat /tmp/pdfcheck.json | jq .
          test "$body" = "200"
          test "$(jq -r '.ok' /tmp/pdfcheck.json)" = "true"
          # Log the runtime pypdf version for the record.
          echo "pypdf on prod: $(jq -r '.pypdfVersion' /tmp/pdfcheck.json)"

[phases.setup]
pkgs = ["nodejs_20", "python311", "poppler_utils"]

[phases.build]
cmds = [
  "npm install --production",
  "cp fill_pdf.py dist/fill_pdf.py || true",
  "PATH=/mise/shims:/usr/local/bin:/usr/bin:/bin:$PATH (which python3 2>/dev/null || which python 2>/dev/null || ls /mise/shims/python3 2>/dev/null || ls /mise/installs/python/*/bin/python3 2>/dev/null | head -1) 2>/dev/null | head -1 > dist/python3_path.txt || true",
  "echo '[build] python3_path.txt:' && cat dist/python3_path.txt"
]

[start]
cmd = "NODE_ENV=production node dist/index.cjs"

[variables]
PORT = "8080"

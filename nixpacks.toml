[phases.setup]
# - python3 runs fill_pdf.py. pypdf is vendored under vendor/*.whl and loaded
#   via zipimport — no pip install at build or runtime. Python 3.9+ required
#   (see vendor/README.md).
# - qpdf strips the empty-password encryption from bundled court PDFs at
#   build time so pypdf never needs the `cryptography` library at runtime.
#   Ontario court templates are "encrypted" with an empty user password as
#   an Adobe-Reader hint, not real crypto; qpdf --decrypt is byte-for-byte
#   lossless (typical 240 KB → 242 KB). See scripts/unlock_pdfs.py.
pkgs = ["nodejs_20", "python3", "qpdf"]

[phases.install]
cmds = [
  # Backend runtime deps.
  "npm install --production",
  # Frontend build tooling (Vite, React, TypeScript, Tailwind). Kept in a
  # separate node_modules under frontend/ so it doesn't bloat the runtime
  # image — the built artifacts land in dist/public/new/ and only those
  # ship. NODE_ENV=development forces devDependencies to install even if
  # nixpacks sets NODE_ENV=production during the install phase (Vite, tsc,
  # tailwind are all devDeps).
  "NODE_ENV=development npm --prefix frontend ci --no-audit --no-fund --include=dev"
]

[phases.build]
cmds = [
  "echo '[build] === STAGE 1: sanity checks ===' && pwd && ls -la",
  "echo '[build] frontend/ present?' && ls -la frontend/ | head -15",
  "echo '[build] frontend/node_modules present?' && ls -la frontend/node_modules/.bin/vite 2>&1 | head -3",
  "cp fill_pdf.py dist/fill_pdf.py || true",
  "mkdir -p dist/vendor && cp vendor/*.whl dist/vendor/ 2>/dev/null || true",
  "python3 scripts/unlock_pdfs.py --dir dist/public/pdfs",
  "(which python3 2>/dev/null || which python 2>/dev/null) | head -1 > dist/python3_path.txt",
  "echo '[build] python3_path.txt:' && cat dist/python3_path.txt",
  "echo '[build] vendored wheels:' && ls -la dist/vendor/ 2>/dev/null || echo '(none)'",
  "echo '[build] qpdf version:' && qpdf --version | head -1",
  # Build the new Vite/React frontend into dist/public/new/. The tsc step
  # runs first (via 'npm run build' inside frontend/) and hard-fails on any
  # TypeScript error, so a bad type never ships.
  "echo '[build] === STAGE 2: building frontend v2 ===' && npm --prefix frontend run build",
  "echo '[build] frontend v2 output:' && ls -la dist/public/new/",
  "echo '[build] verifying frontend v2 index.html:' && test -f dist/public/new/index.html && echo 'OK: index.html present' || (echo 'FAIL: index.html MISSING' && exit 1)",
  # Syntax-check every .js file in dist/public/assets/. A single bad character
  # in one of these bundles used to ship silently and break the whole UI at
  # runtime. `node --check` fails the build before the bad code deploys.
  # Uses a shell loop so new .js files are picked up automatically.
  "echo '[build] node --check on all legacy frontend bundles:' && for f in dist/public/assets/*.js; do node --check \"$f\" && echo \"  $f: OK\"; done"
]

[start]
cmd = "NODE_ENV=production node dist/index.cjs"

[variables]
PORT = "8080"
